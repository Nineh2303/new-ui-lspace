<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đang xử lý đăng nhập - LangSpace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-md border border-slate-200 tracking-wide w-full max-w-sm p-6 text-center">
    <div id="loading-state">
      <div class="flex flex-col items-center">
        <!-- Google animated-like spinner -->
        <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <h1 class="text-lg font-medium text-slate-800">Đang đồng bộ đăng nhập...</h1>
        <p class="text-sm text-slate-500 mt-2">Đang liên lạc với máy chủ LangSpace để xác thực tài khoản của bạn.</p>
      </div>
    </div>
    
    <div id="error-state" class="hidden">
      <div class="flex flex-col items-center">
        <div class="bg-red-50 text-red-500 rounded-full p-3 mb-4">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <h1 class="text-lg font-medium text-red-600" id="error-title">Đăng nhập thất bại</h1>
        <p class="text-sm text-slate-500 mt-2" id="error-message">Có lỗi xảy ra trong quá trình xác thực với Google.</p>
        <button onclick="window.close()" class="mt-4 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition duration-150">
          Đóng cửa sổ
        </button>
      </div>
    </div>
  </div>

  <script>
    (async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');

      if (error) {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('error-state').classList.remove('hidden');
        document.getElementById('error-message').innerText = error;

        // Broadcast to parent
        if (window.opener) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_FAILURE', error }, window.location.origin);
          } catch (e) {
            console.error('Failed to postMessage error:', e);
          }
        }
        return;
      }

      if (code) {
        // Save to parent-accessible localStorage (sharing the same domain!)
        try {
          localStorage.setItem('google_auth_code', code);
        } catch (e) {
          console.error('Failed to write to localStorage:', e);
        }

        // Send via postMessage
        if (window.opener) {
          try {
              console.log("login success")
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_CODE_SUCCESS',
              code: code,
              redirectUri: window.location.origin + window.location.pathname
            }, window.location.origin);
          } catch (e) {
            console.error('Failed to postMessage code:', e);
          }
        }

        // Close after a very brief delay to let postMessage execute smoothly
        setTimeout(() => {
          window.close();
        }, 150);
      } else {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('error-state').classList.remove('hidden');
        document.getElementById('error-message').innerText = 'Không thể tìm thấy mã xác thực Google.';
      }
    })();
  </script>
</body>
</html>
